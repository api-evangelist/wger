generated: '2026-08-27'
method: searched
source: https://wger.readthedocs.io/en/latest/api/api.html
docs: https://wger.readthedocs.io/en/latest/api/api.html
note: >-
  wger has no test-mode/live-mode split and no test credentials — there is
  nothing to charge, so there are no test cards, no key prefixes, and no
  fixture triggers. What it does publish is stronger for a read-heavy API: an
  anonymous, no-signup live surface plus two interactive consoles served by the
  API itself, and a full local instance anyone can stand up from a container in
  minutes. Every value below was probed on 2026-08-27; none is invented.
test_mode:
  exists: false
  key_prefixes: []
  note: no separate test environment; the consoles below hit real data
consoles:
  - name: Swagger UI
    url: https://wger.de/api/v2/schema/ui
    status: 200
    checked: '2026-08-27'
    try_it: true
    description: >-
      Generated by drf-spectacular from the same schema saved in
      openapi/wger-openapi.yml. Lets a caller execute requests in the browser.
  - name: ReDoc
    url: https://wger.de/api/v2/schema/redoc
    status: 200
    checked: '2026-08-27'
    try_it: false
    description: Read-only reference rendering of the same schema
  - name: Browsable API (DRF)
    url: https://wger.de/api/v2/
    status: 200
    checked: '2026-08-27'
    try_it: true
    description: >-
      The API root returns a JSON index of every collection to a JSON client and
      renders DRF's browsable HTML form view in a browser. The .api URL suffix
      forces the HTML view on any endpoint.
anonymous_playground:
  exists: true
  description: >-
    The community reference data is callable with no account and no key, which
    makes it a real zero-friction playground rather than a demo.
  verified_calls:
    - request: GET https://wger.de/api/v2/exerciseinfo/?limit=1
      status: 200
      auth: none
      checked: '2026-08-27'
    - request: GET https://wger.de/api/v2/ingredient/?limit=1
      status: 200
      auth: none
      checked: '2026-08-27'
  open_endpoints:
    - /api/v2/exercise/
    - /api/v2/exerciseinfo/
    - /api/v2/exercisecategory/
    - /api/v2/muscle/
    - /api/v2/equipment/
    - /api/v2/ingredient/
    - /api/v2/ingredientinfo/
    - /api/v2/language/
    - /api/v2/license/
    - /api/v2/public-templates/
    - /api/v2/setting-repetitionunit/
    - /api/v2/setting-weightunit/
guest_account:
  exists: true
  path: /en/user/demo-entries
  description: >-
    wger ships a demo/guest-account flow that populates an account with sample
    workout, nutrition and weight entries so the app can be explored with data.
  source: https://github.com/wger-project/wger/blob/master/wger/core/urls.py
  caveat: >-
    URL confirmed present in the project's own URL configuration; the page
    itself could not be rendered from here because wger.de fronts all HTML with
    an Anubis bot-check interstitial (HTTP 200 challenge page on every HTML
    path, including nonexistent ones).
local_instance:
  supported: true
  description: >-
    The honest full-fidelity sandbox for wger is a local instance — same code,
    same schema, throwaway data, no rate limits you share with anyone.
  quickstart:
    - docker compose stack — https://github.com/wger-project/docker
    - helm chart — https://github.com/wger-project/helm-charts
    - 'pip: wger bootstrap && wger start'
  fixtures:
    - command: wger load-fixtures
      description: bundled initial data (categories, units, languages)
    - command: wger load-online-fixtures
      description: the full community exercise and ingredient dataset
    - repository: https://github.com/wger-project/data
