note: >-
  wger publishes the React component library that its own web application is
  built from. This is a genuine embeddable client-side surface — distinct from
  the SDKs in packages/wger-packages.yml, which call the API from server or
  script code — but it is published as "the components used in the wger
  application" rather than as a documented embed product: there is no hosted
  loader script, no widget documentation page, and no drop-in <script> tag. A
  consumer imports them into a React build.
