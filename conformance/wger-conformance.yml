conformance:
  - id: openapi
    conforms: true
    version: 3.0.3
    evidence: >-
      openapi/wger-openapi.yml, fetched HTTP 200 from
      https://wger.de/api/v2/schema (content-type
      application/vnd.oai.openapi). 129 paths, 254 operations, 217 component
      schemas, unique operationIds throughout, generated from the code by
      drf-spectacular.
  - id: oauth2
    conforms: true
    evidence: >-
      components.securitySchemes.oidcAuth declares an authorizationCode flow
      with authorizationUrl https://wger.de/identity/o/authorize and tokenUrl
      https://wger.de/identity/o/api/token. wger 2.7 adds a full OAuth2
      provider (django-oauth-toolkit).
  - id: oidc
    conforms: true
    evidence: >-
      https://wger.de/.well-known/openid-configuration returns HTTP 200 with
      issuer, authorization_endpoint, token_endpoint, userinfo_endpoint,
      jwks_uri, end_session_endpoint, revocation_endpoint,
      id_token_signing_alg_values_supported [RS256] and
      subject_types_supported [public]. Probed 2026-08-27.
    caveat: >-
      The advertised jwks_uri (https://wger.de/.well-known/jwks.json) returns
      HTTP 200 with an EMPTY key set — {"keys": []} — so an RP cannot today
      validate an id_token signature against wger.de's published keys.
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata
    conforms: partial
    evidence: >-
      Metadata is published, but at /.well-known/openid-configuration only;
      /.well-known/oauth-authorization-server returns 404 (probed 2026-08-27).
  - id: rfc7636
    name: PKCE
    conforms: true
    evidence: code_challenge_methods_supported [S256] in the discovery document
  - id: rfc8628
    name: OAuth 2.0 Device Authorization Grant
    conforms: true
    evidence: >-
      grant_types_supported includes urn:ietf:params:oauth:grant-type:device_code
      and device_authorization_endpoint is https://wger.de/identity/o/api/device/code
  - id: rfc8693
    name: OAuth 2.0 Token Exchange
    conforms: true
    scope: mcp-server
    evidence: >-
      The first-party MCP server performs an RFC 8693 token exchange to obtain
      a wger-audienced access token, documented in ADR 0001 —
      https://github.com/wger-project/mcp-server/blob/master/docs/adr/0001-multi-user-auth-via-oidc-token-exchange.md
  - id: jwt
    conforms: true
    evidence: >-
      securitySchemes jwtAuth and headlessJwtAuth are http/bearer with
      bearerFormat JWT; /api/v2/token/refresh and /api/v2/token/verify are
