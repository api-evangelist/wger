domain_standards:
  note: >-
    REWARD-ONLY check. Consumer fitness and nutrition tracking has no
    ratified interchange standard the way healthcare has HL7/FHIR or finance
    has ISO 20022, and wger is not a clinical or regulated system — it does not
    claim FHIR, and asserting one would be inventing a conformance to fill a
    slot. What it DOES do is bind to the de facto reference database for its
    domain, which is the closest real analogue and is visible in the contract
    rather than in marketing prose.
  standards:
    - id: open-food-facts
      name: Open Food Facts
      kind: reference-data-interop
      conforms: true
      evidence: >-
        The ingredient catalog is imported and continuously synced from Open
        Food Facts, carrying OFF-native fields into the contract:
        components.schemas ingredient exposes code (EAN/UPC barcode), and
        wger 2.5 added is_vegan, is_vegetarian and nutriscore, with wger 2.6 adding
        range lookups (gt/gte/lt/lte) on nutriscore. Serving sizes are imported
        from OFF into ingredientweightunit. The first-party MCP server exposes
        OFF barcode lookup directly (lookup_food_by_barcode) and returns a
        normalised wger_ingredient_payload.
      spec_locations:
        - components.schemas.Ingredient.code
        - components.schemas.Ingredient.nutriscore
        - /api/v2/ingredient/?code={barcode}
        - /api/v2/ingredientweightunit/
      source: https://github.com/wger-project/wger/releases/tag/2.5
    - id: gtin-ean-upc
      name: GTIN / EAN / UPC barcodes
      kind: identifier-scheme
      conforms: true
      evidence: >-
        Ingredients are addressable by their retail barcode through the
        documented ?code= exact-match filter, which is the identifier scheme
        the grocery domain actually runs on.
    - id: iso-639-1
      name: ISO 639-1 language codes
      kind: identifier-scheme
      conforms: true
      evidence: >-
        /api/v2/language/ and the language filters on exercise and ingredient
        search use ISO 639-1 two-letter codes.
