note: >-
  wger is a self-hosted product, so its "packages" split into two kinds: client
  libraries that CALL the REST API (wger-api-client, wger-mcp) and distributions
  of the server itself (wger on PyPI, the Docker/Helm stacks). Both are
  first-party, published by the wger-project organization. Registry versions and
  dates below are read from registry.npmjs.org / pypi.org JSON metadata, not
  from prose.
packages:
  - language: python
    registry: pypi
    name: wger-api-client
    url: https://pypi.org/project/wger-api-client/
    install: pip install wger-api-client
    official: true
    kind: client-sdk
    version: 2.6.1
    published: '2026-08-13'
    repository: https://github.com/wger-project/api-client
    license: Apache-2.0
    description: >-
      Typed Python client for the wger REST API, generated from the server's
      OpenAPI schema with openapi-python-client and built on httpx. Sync and
      async call for every endpoint. Major.minor tracks the wger release it
      targets, so 2.6.x is meant for a 2.6 server.
  - language: python
    registry: pypi
    name: wger-mcp
    url: https://pypi.org/project/wger-mcp/
    install: uvx wger-mcp
    official: true
    kind: mcp-server
    version: 0.2.0
    published: '2026-08-26'
    repository: https://github.com/wger-project/mcp-server
    license: AGPL-3.0
    description: >-
      MCP server exposing the wger REST API as 85 tools, with stdio and
      Streamable HTTP transports and pluggable auth (OIDC token exchange or a
      static token).
  - language: javascript
    registry: npm
    name: "@wger-project/react-components"
    url: https://www.npmjs.com/package/@wger-project/react-components
    install: npm install @wger-project/react-components
    official: true
    kind: ui-components
    version: 26.8.12
    published: '2026-08-12'
    repository: https://github.com/wger-project/react
    description: >-
      The React components used inside the wger application itself, published
      for reuse. Calendar-style versioning (YY.M.D), not aligned to the server
      release train.
  - language: python
    registry: pypi
    name: wger
    url: https://pypi.org/project/wger/
    install: pip install wger
    official: true
    kind: server-distribution
    version: '2.1'
    published: '2022-10-11'
    repository: https://github.com/wger-project/wger
    license: AGPL-3.0
    description: >-
      The wger server itself, packaged for pip. Provides the `wger` console
