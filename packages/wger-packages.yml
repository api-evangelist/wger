    staleness_note: >-
      DECAY SIGNAL — the PyPI distribution is pinned at 2.1 (2022-10-11) while
      the project has since shipped 2.2 (2023-12-06), 2.3 (2025-04-05), 2.4
      (2026-01-18), 2.5 (2026-04-15) and 2.6 (2026-06-17) on GitHub, and the
      live wger.de instance reports 2.7.0a2 in its OpenAPI info.version. Four
      years and five releases behind. The project's documented install paths are
      now Docker and the source checkout, not PyPI; this is not an abandoned
      API, it is an abandoned distribution channel.
