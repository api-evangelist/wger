name: Wger
description: >-
  wger (wger Workout Manager) is a self-hosted, free and open source (AGPL-3.0)
  fitness, workout, nutrition and body-weight tracker written in Django. Its
  REST API is served under /api/v2/ on any wger instance — including the
  project's own hosted instance at wger.de — and publishes a complete OpenAPI
  3.0.3 schema generated from the code at /api/v2/schema, covering 129 paths and
  254 operations across routines, days, slots and per-iteration progression
  configs, workout logs and sessions, the community exercise database
  (exercises, translations, images, videos, muscles, equipment, categories), the
  ingredient and nutrition-plan catalog with an incremental ingredient-sync
  feed, body weight, body measurements, galleries and gamification trophies.
  System-wide reference data (exercises, ingredients, units) is readable without
  authentication; user-owned data takes a personal API token, a JWT issued via
  allauth-headless, an OAuth2/OIDC access token, or the session cookie. The
  project also ships a first-party Python API client, a first-party MCP server
  exposing 85 tools over the same API, React components, Flutter and Android
  apps, and Docker/Helm deployment stacks.
