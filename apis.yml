    description: >-
      The wger REST API, served under /api/v2/ on every wger instance. Returns
      JSON by default, uses limit/offset pagination (cursor pagination on
      /api/v2/ingredient-sync/), supports ordering and field filtering, and
      documents itself with a drf-spectacular generated OpenAPI 3.0.3 schema at
      /api/v2/schema. Public reference data is anonymous; user data requires a
      Token, JWT Bearer, OAuth2/OIDC token or session cookie.
