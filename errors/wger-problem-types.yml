generated: '2026-08-27'
method: derived
source: openapi/wger-openapi.yml
docs: https://wger.readthedocs.io/en/latest/api/api.html
format: not-rfc9457
format_note: >-
  wger does NOT emit application/problem+json. Errors are the Django REST
  Framework default envelope — a JSON object whose keys are either "detail"
  (a single message) or the offending field names mapped to arrays of
  validation messages. There is no type URI, no title/status/instance, and no
  machine-readable error code. An agent must branch on the HTTP status and,
  for 400, walk the field map.
coverage_note: >-
  The OpenAPI schema declares explicit 4xx/5xx responses on only five
  operations (listed below under declared[]). Every other operation documents
  its 2xx shape and leaves failure to DRF's defaults, so the rest of this
  catalog is the framework contract that actually applies, recorded so an agent
  is not left guessing. Nothing here is invented: the statuses are DRF's
  documented behaviour plus the throttle behaviour wger's own docs state.
envelope:
  variants:
    - name: detail
      shape: '{"detail": "<message>"}'
      used_for: [401, 403, 404, 405, 429]
    - name: field_errors
      shape: '{"<field>": ["<message>", ...]}'
      used_for: [400]
    - name: non_field_errors
      shape: '{"non_field_errors": ["<message>"]}'
      used_for: [400]
  content_type: application/json
