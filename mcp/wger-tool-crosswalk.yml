note: >-
  The wger MCP server's live tools/list could not be introspected — the project
  publishes no hosted endpoint, so a real inputSchema read requires running the
  server locally with a wger credential. Rows are therefore bound by name and by
  the argument signatures the provider documents in its own README, against
  operationIds verified present in openapi/wger-openapi.yml. Confidence is set
  accordingly: high where the tool name and its arguments map 1:1 onto a single
  documented operation, medium where the tool composes several operations or
  the provider documents it as a convenience/alias, low where the backing
  operation is inferred.
