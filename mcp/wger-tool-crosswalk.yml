mcp_only:
  - tool: calculate_daily_calories
    reason: >-
      Mifflin-St Jeor TDEE + macro split computed in the server. Its inputs are
      auto-filled from userprofile_retrieve and the latest weightentry_list, and
      with apply_to_profile=True the result is PATCHed back via
      userprofile_partial_update, but the calculation itself has no REST operation.
  - tool: weekly_summary
    reason: >-
      analytics aggregate over workoutlog_list — sets, reps and volume per
      exercise. wger exposes routine_stats_retrieve for a single routine, but no
      cross-routine weekly aggregate.
  - tool: exercise_history
    reason: per-session aggregates for one exercise, computed from workoutlog_list
  - tool: personal_records
    reason: >-
      max weight, max reps and Epley-estimated 1RM per exercise. The 1RM
      estimate exists only in the MCP server.
  - tool: volume_trend
    reason: >-
      day/week/month bucketed volume with group_by none/exercise/muscle/category,
      computed from workoutlog_list plus cached exercise metadata
  - tool: compare_periods
    reason: rolling window A vs B with delta and delta%, computed in the server
  - tool: lookup_food_by_barcode
    reason: >-
      calls Open Food Facts, a third-party database, not wger. Returns a
      normalised wger_ingredient_payload for information only.
  - tool: lookup_foods_by_barcodes
    reason: batch Open Food Facts lookup with concurrency cap and 429 retry
rest_only:
  - operations: [exercise_create, exercise_update, exercise_partial_update, exercise_destroy, exercise_submission_create]
    reason: >-
      contributing to the community exercise database. The MCP server reads the
      catalog but does not expose submission or moderation.
  - operations: [exercise_translation_list, exercise_translation_create, exercise_translation_retrieve, exercise_translation_update, exercise_translation_partial_update, exercise_translation_destroy]
    reason: exercise translation authoring is not exposed as a tool
  - operations: [exercisealias_list, exercisealias_create, exercisealias_retrieve, exercisealias_update, exercisealias_partial_update, exercisealias_destroy]
    reason: exercise aliases not exposed
  - operations: [exercisecomment_list, exercisecomment_create, exercisecomment_retrieve, exercisecomment_update, exercisecomment_partial_update, exercisecomment_destroy]
    reason: exercise comments/instructions authoring not exposed
  - operations: [exerciseimage_list, exerciseimage_create, exerciseimage_retrieve, exerciseimage_update, exerciseimage_partial_update, exerciseimage_destroy]
    reason: image upload not exposed; get_exercise returns image URLs read-only
  - operations: [video_list, video_create, video_retrieve, video_update, video_partial_update, video_destroy]
    reason: exercise video upload/management not exposed
  - operations: [gallery_list, gallery_create, gallery_retrieve, gallery_update, gallery_partial_update, gallery_destroy]
    reason: the user progress-photo gallery has no tool
  - operations: [trophy_list, trophy_retrieve, trophy_progress_list, user_trophy_list, user_trophy_retrieve]
    reason: gamification/trophies have no tools
  - operations: [user_statistics_list, user_statistics_retrieve]
    reason: >-
      wger's own server-side user statistics are not surfaced; the analytics
      tools recompute from the logs instead
  - operations: [templates_list, templates_retrieve, public_templates_list, public_templates_retrieve]
    reason: >-
      routine templates are readable over REST; the MCP server exposes
      is_template / is_public on create_routine but no template browse tool
  - operations: [ingredient_sync_list, ingredient_sync_retrieve]
    reason: >-
      the cursor-paginated bulk ingredient sync feed is an instance-to-instance
      catalog replication surface, not an agent surface
  - operations: [ingredient_image_list, ingredient_image_retrieve]
    reason: ingredient images not exposed
  - operations: [deletion_log_list, deletion_log_retrieve]
    reason: tombstone feed for offline clients; not an agent surface
  - operations: [powersync_keys_retrieve, powersync_token_retrieve, upload_powersync_data_update, upload_powersync_data_partial_update, upload_powersync_data_destroy]
    reason: PowerSync offline-replication surface for the mobile apps
  - operations: [token_refresh_create, token_verify_create, issue_refresh_token_create]
    reason: >-
      JWT lifecycle. The MCP server handles credentials itself (API key, or OIDC
      token exchange) and does not expose token operations as tools.
  - operations: [userprofile_verify_email_create, check_permission_retrieve, check_language_create]
    reason: account/permission plumbing
  - operations: [version_retrieve, min_app_version_retrieve, min_server_version_retrieve, schema_retrieve]
    reason: instance metadata and self-description
  - operations: [language_list, language_retrieve, license_list, license_retrieve, setting_repetitionunit_list, setting_repetitionunit_retrieve, setting_weightunit_list, setting_weightunit_retrieve]
    reason: >-
      reference vocabularies. The tools take the human-facing values (kg/lb,
      ISO 639-1 codes) directly instead of exposing the id lookups.
