openapi: 3.2.0
info:
  title: wger Issue Refresh Token API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: issue-refresh-token
paths:
  /api/v2/issue-refresh-token:
    post:
      operationId: issue_refresh_token_create
      description: 'Temporary endpoint for issuing refresh tokens for authenticated users.


        This endpoint is used to allow users of the mobile app to seamlessly move from

        permanent tokens to JWT ones.


        TODO: remove one version after the iniial offline-mode release'
      tags:
      - issue-refresh-token
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: ''
      summary: Issue refresh token create
      x-summary-source: derived
components:
  schemas:
    RefreshTokenResponse:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
