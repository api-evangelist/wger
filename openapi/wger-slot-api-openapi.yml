openapi: 3.2.0
info:
  title: wger Slot API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: Slot
paths:
  /api/v2/slot/:
    get:
      operationId: slot_list
      description: API endpoint for routine slot objects
      parameters:
      - in: query
        name: comment
        schema:
          type: string
      - in: query
        name: day
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Slot
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSlotList'
          description: ''
      summary: Slot list
      x-summary-source: derived
    post:
      operationId: slot_create
      description: API endpoint for routine slot objects
      tags:
      - Slot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
      summary: Slot create
      x-summary-source: derived
  /api/v2/slot/{id}/:
    get:
      operationId: slot_retrieve
      description: API endpoint for routine slot objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot.
        required: true
      tags:
      - Slot
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
      summary: Slot retrieve
      x-summary-source: derived
    put:
      operationId: slot_update
      description: API endpoint for routine slot objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot.
        required: true
      tags:
      - Slot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
      summary: Slot update
      x-summary-source: derived
    patch:
      operationId: slot_partial_update
      description: API endpoint for routine slot objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot.
        required: true
      tags:
      - Slot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSlotRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
          description: ''
      summary: Slot partial update
      x-summary-source: derived
    delete:
      operationId: slot_destroy
      description: API endpoint for routine slot objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot.
        required: true
      tags:
      - Slot
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Slot destroy
      x-summary-source: derived
components:
  schemas:
    PatchedSlotRequest:
      type: object
      description: Slot
      properties:
        day:
          type: integer
          title: Exercise day
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 200
        config: {}
    PaginatedSlotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    SlotRequest:
      type: object
      description: Slot
      properties:
        day:
          type: integer
          title: Exercise day
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 200
        config: {}
      required:
      - day
    Slot:
      type: object
      description: Slot
      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: integer
          title: Exercise day
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 200
        config: {}
      required:
      - day
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
