openapi: 3.2.0
info:
  title: wger Day API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: day
paths:
  /api/v2/day/:
    get:
      operationId: day_list
      description: API endpoint for routine day objects
      parameters:
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: is_rest
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: need_logs_to_advance
        schema:
          type: boolean
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: routine
        schema:
          type: integer
      tags:
      - day
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDayList'
          description: ''
      summary: Day list
      x-summary-source: derived
    post:
      operationId: day_create
      description: API endpoint for routine day objects
      tags:
      - day
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
      summary: Day create
      x-summary-source: derived
  /api/v2/day/{id}/:
    get:
      operationId: day_retrieve
      description: API endpoint for routine day objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this day.
        required: true
      tags:
      - day
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
      summary: Day retrieve
      x-summary-source: derived
    put:
      operationId: day_update
      description: API endpoint for routine day objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this day.
        required: true
      tags:
      - day
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
      summary: Day update
      x-summary-source: derived
    patch:
      operationId: day_partial_update
      description: API endpoint for routine day objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this day.
        required: true
      tags:
      - day
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDayRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
      summary: Day partial update
      x-summary-source: derived
    delete:
      operationId: day_destroy
      description: API endpoint for routine day objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this day.
        required: true
      tags:
      - day
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Day destroy
      x-summary-source: derived
components:
  schemas:
    PaginatedDayList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Day'
    DayRequest:
      type: object
      description: Day serializer
      properties:
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        is_rest:
          type: boolean
        need_logs_to_advance:
          type: boolean
        type:
          $ref: '#/components/schemas/DayTypeEnum'
        config: {}
      required:
      - routine
    PatchedDayRequest:
      type: object
      description: Day serializer
      properties:
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        is_rest:
          type: boolean
        need_logs_to_advance:
          type: boolean
        type:
          $ref: '#/components/schemas/DayTypeEnum'
        config: {}
    DayTypeEnum:
      enum:
      - custom
      - enom
      - amrap
      - hiit
      - tabata
      - edt
      - rft
      - afap
      type: string
      description: '* `custom` - Custom

        * `enom` - Enom

        * `amrap` - Amrap

        * `hiit` - Hiit

        * `tabata` - Tabata

        * `edt` - Edt

        * `rft` - Rft

        * `afap` - Afap'
    Day:
      type: object
      description: Day serializer
      properties:
        id:
          type: integer
          readOnly: true
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        is_rest:
          type: boolean
        need_logs_to_advance:
          type: boolean
        type:
          $ref: '#/components/schemas/DayTypeEnum'
        config: {}
      required:
      - id
      - routine
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
