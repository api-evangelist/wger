openapi: 3.2.0
info:
  title: wger Slot Entry API
  version: 2.7.0a2
  description: "Self hosted FLOSS workout and fitness tracker.\n\n## Authentication\n\nSystem-wide data such as the exercise database, ingredients and units can be\nread without authenticating. Everything tied to a user account needs one of the\nfollowing, which are tried in this order:\n\n* `Authorization: Token <key>` with a personal API key. Users create one on the\n  API key page of their profile, e.g. `/en/user/api-key`.\n* `Authorization: Bearer <token>` with a JWT access token.\n* The session cookie, which is what a logged-in browser uses.\n\n## Pagination\n\nList endpoints take `limit` and `offset`, and answer with `count`, `next`,\n`previous` and `results`. The default page size is 20 and `limit` is capped\nat 999.\n\n`/api/v2/ingredient-sync/` is the exception. It uses cursor pagination so that\nsyncing the catalogue stays fast no matter how far a client has paginated. That\nresponse carries no `count`, and clients follow `next` instead of picking an\noffset.\n\n## Filtering and ordering\n\nMost list endpoints accept filters on a subset of their fields, plus `ordering`\nwith a field name that can be prefixed with `-` to reverse it. Both are listed\nper endpoint.\n\n## Unknown fields are dropped on write\n\nA field that the endpoint does not declare is ignored instead of rejected. Such\na request still answers 200 or 201, and the unknown field simply has no effect,\nso check a write against the response body rather than the status code.\n\n## Rate limits\n\nThe ingredient endpoints are rate limited because the catalogue holds millions\nof rows, and creating exercises is capped as well. Limits count per user for\nauthenticated callers and per IP otherwise. Exceeding one answers 429.\n"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: slot-entry
paths:
  /api/v2/slot-entry/:
    get:
      operationId: slot_entry_list
      description: API endpoint for routine slot entry objects
      parameters:
      - in: query
        name: comment
        schema:
          type: string
      - in: query
        name: exercise
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: repetition_rounding
        schema:
          type: number
      - in: query
        name: repetition_unit
        schema:
          type: integer
      - in: query
        name: slot
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - dropset
          - forced
          - iso
          - jump
          - myo
          - normal
          - partial
          - tut
          - warmup
        description: '* `normal` - Normal

          * `warmup` - Warmup

          * `dropset` - Dropset

          * `myo` - Myo

          * `partial` - Partial

          * `forced` - Forced

          * `tut` - Tut

          * `iso` - Iso Hold

          * `jump` - Jump'
      - in: query
        name: weight_rounding
        schema:
          type: number
      - in: query
        name: weight_unit
        schema:
          type: integer
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSlotEntryList'
          description: ''
    post:
      operationId: slot_entry_create
      description: API endpoint for routine slot entry objects
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
  /api/v2/slot-entry/{id}/:
    get:
      operationId: slot_entry_retrieve
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
    put:
      operationId: slot_entry_update
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
    patch:
      operationId: slot_entry_partial_update
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSlotEntryRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
    delete:
      operationId: slot_entry_destroy
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    SlotEntry:
      type: object
      description: Slot entry serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
      required:
      - exercise
      - id
      - slot
    PaginatedSlotEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SlotEntry'
    SlotEntryRequest:
      type: object
      description: Slot entry serializer
      properties:
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
      required:
      - exercise
      - slot
    ExerciseTypeEnum:
      enum:
      - normal
      - warmup
      - dropset
      - myo
      - partial
      - forced
      - tut
      - iso
      - jump
      type: string
      description: '* `normal` - Normal

        * `warmup` - Warmup

        * `dropset` - Dropset

        * `myo` - Myo

        * `partial` - Partial

        * `forced` - Forced

        * `tut` - Tut

        * `iso` - Iso Hold

        * `jump` - Jump'
    PatchedSlotEntryRequest:
      type: object
      description: Slot entry serializer
      properties:
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
