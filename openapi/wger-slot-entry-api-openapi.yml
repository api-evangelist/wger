openapi: 3.2.0
info:
  title: wger Slot Entry API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: slot-entry
paths:
  /api/v2/slot-entry/:
    get:
      operationId: slot_entry_list
      description: API endpoint for routine slot entry objects
      parameters:
      - in: query
        name: comment
        schema:
          type: string
      - in: query
        name: exercise
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: repetition_rounding
        schema:
          type: number
      - in: query
        name: repetition_unit
        schema:
          type: integer
      - in: query
        name: slot
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - dropset
          - forced
          - iso
          - jump
          - myo
          - normal
          - partial
          - tut
          - warmup
        description: '* `normal` - Normal

          * `warmup` - Warmup

          * `dropset` - Dropset

          * `myo` - Myo

          * `partial` - Partial

          * `forced` - Forced

          * `tut` - Tut

          * `iso` - Iso Hold

          * `jump` - Jump'
      - in: query
        name: weight_rounding
        schema:
          type: number
      - in: query
        name: weight_unit
        schema:
          type: integer
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSlotEntryList'
          description: ''
      summary: Slot entry list
      x-summary-source: derived
    post:
      operationId: slot_entry_create
      description: API endpoint for routine slot entry objects
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
      summary: Slot entry create
      x-summary-source: derived
  /api/v2/slot-entry/{id}/:
    get:
      operationId: slot_entry_retrieve
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
      summary: Slot entry retrieve
      x-summary-source: derived
    put:
      operationId: slot_entry_update
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
      summary: Slot entry update
      x-summary-source: derived
    patch:
      operationId: slot_entry_partial_update
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSlotEntryRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotEntry'
          description: ''
      summary: Slot entry partial update
      x-summary-source: derived
    delete:
      operationId: slot_entry_destroy
      description: API endpoint for routine slot entry objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this slot entry.
        required: true
      tags:
      - slot-entry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Slot entry destroy
      x-summary-source: derived
components:
  schemas:
    PaginatedSlotEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/SlotEntry'
    SlotEntryRequest:
      type: object
      description: Slot entry serializer
      properties:
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
      required:
      - exercise
      - slot
    ExerciseTypeEnum:
      enum:
      - normal
      - warmup
      - dropset
      - myo
      - partial
      - forced
      - tut
      - iso
      - jump
      type: string
      description: '* `normal` - Normal

        * `warmup` - Warmup

        * `dropset` - Dropset

        * `myo` - Myo

        * `partial` - Partial

        * `forced` - Forced

        * `tut` - Tut

        * `iso` - Iso Hold

        * `jump` - Jump'
    SlotEntry:
      type: object
      description: Slot entry serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
      required:
      - exercise
      - id
      - slot
    PatchedSlotEntryRequest:
      type: object
      description: Slot entry serializer
      properties:
        slot:
          type: integer
        exercise:
          type: integer
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        config: {}
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
