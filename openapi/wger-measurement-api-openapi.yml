openapi: 3.2.0
info:
  title: wger Measurement API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: Measurement
paths:
  /api/v2/measurement/:
    get:
      operationId: measurement_list
      description: API endpoint for measurements
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: category__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: date
        schema:
          type: string
          format: date-time
      - in: query
        name: date__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: date__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: id
        schema:
          type: string
          format: uuid
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - Measurement
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeasurementList'
          description: ''
      summary: Measurement list
      x-summary-source: derived
    post:
      operationId: measurement_create
      description: API endpoint for measurements
      tags:
      - Measurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
          description: ''
      summary: Measurement create
      x-summary-source: derived
  /api/v2/measurement/{id}/:
    get:
      operationId: measurement_retrieve
      description: API endpoint for measurements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this measurement.
        required: true
      tags:
      - Measurement
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
          description: ''
      summary: Measurement retrieve
      x-summary-source: derived
    put:
      operationId: measurement_update
      description: API endpoint for measurements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this measurement.
        required: true
      tags:
      - Measurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
          description: ''
      summary: Measurement update
      x-summary-source: derived
    patch:
      operationId: measurement_partial_update
      description: API endpoint for measurements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this measurement.
        required: true
      tags:
      - Measurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeasurementRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurement'
          description: ''
      summary: Measurement partial update
      x-summary-source: derived
    delete:
      operationId: measurement_destroy
      description: API endpoint for measurements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this measurement.
        required: true
      tags:
      - Measurement
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Measurement destroy
      x-summary-source: derived
components:
  schemas:
    Measurement:
      type: object
      description: Measurement serializer
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        value:
          type: number
          format: double
          maximum: 5000
          minimum: 0
        notes:
          type: string
          title: Description
          maxLength: 100
      required:
      - category
      - value
    PaginatedMeasurementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    PatchedMeasurementRequest:
      type: object
      description: Measurement serializer
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        value:
          type: number
          format: double
          maximum: 5000
          minimum: 0
        notes:
          type: string
          title: Description
          maxLength: 100
    MeasurementRequest:
      type: object
      description: Measurement serializer
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        value:
          type: number
          format: double
          maximum: 5000
          minimum: 0
        notes:
          type: string
          title: Description
          maxLength: 100
      required:
      - category
      - value
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
