openapi: 3.2.0
info:
  title: wger Meal API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: meal
paths:
  /api/v2/meal/:
    get:
      operationId: meal_list
      description: API endpoint for meal objects
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: plan
        schema:
          type: string
          format: uuid
      - in: query
        name: time
        schema:
          type: string
          format: time
      tags:
      - meal
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMealList'
          description: ''
      summary: Meal list
      x-summary-source: derived
    post:
      operationId: meal_create
      description: API endpoint for meal objects
      tags:
      - meal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
          description: ''
      summary: Meal create
      x-summary-source: derived
  /api/v2/meal/{id}/:
    get:
      operationId: meal_retrieve
      description: API endpoint for meal objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal.
        required: true
      tags:
      - meal
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
          description: ''
      summary: Meal retrieve
      x-summary-source: derived
    put:
      operationId: meal_update
      description: API endpoint for meal objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal.
        required: true
      tags:
      - meal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
          description: ''
      summary: Meal update
      x-summary-source: derived
    patch:
      operationId: meal_partial_update
      description: API endpoint for meal objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal.
        required: true
      tags:
      - meal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMealRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
          description: ''
      summary: Meal partial update
      x-summary-source: derived
    delete:
      operationId: meal_destroy
      description: API endpoint for meal objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal.
        required: true
      tags:
      - meal
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Meal destroy
      x-summary-source: derived
  /api/v2/meal/{id}/nutritional_values/:
    get:
      operationId: meal_nutritional_values_retrieve
      description: Return an overview of the nutritional plan's values
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal.
        required: true
      tags:
      - meal
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionalValues'
          description: ''
      summary: Meal nutritional values retrieve
      x-summary-source: derived
components:
  schemas:
    Meal:
      type: object
      description: Meal serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        order:
          type: integer
          readOnly: true
        time:
          type:
          - string
          - 'null'
          format: time
          title: Time (approx)
        name:
          type: string
          description: Give meals a textual description / name such as "Breakfast" or "after workout"
          maxLength: 25
      required:
      - order
      - plan
    NutritionalValues:
      type: object
      description: Nutritional values serializer
      properties:
        energy:
          type: number
          format: double
        protein:
          type: number
          format: double
        carbohydrates:
          type: number
          format: double
        carbohydrates_sugar:
          type:
          - number
          - 'null'
          format: double
        fat:
          type: number
          format: double
        fat_saturated:
          type:
          - number
          - 'null'
          format: double
        fiber:
          type:
          - number
          - 'null'
          format: double
        sodium:
          type:
          - number
          - 'null'
          format: double
      required:
      - carbohydrates
      - carbohydrates_sugar
      - energy
      - fat
      - fat_saturated
      - fiber
      - protein
      - sodium
    PatchedMealRequest:
      type: object
      description: Meal serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        time:
          type:
          - string
          - 'null'
          format: time
          title: Time (approx)
        name:
          type: string
          description: Give meals a textual description / name such as "Breakfast" or "after workout"
          maxLength: 25
    PaginatedMealList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Meal'
    MealRequest:
      type: object
      description: Meal serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        time:
          type:
          - string
          - 'null'
          format: time
          title: Time (approx)
        name:
          type: string
          description: Give meals a textual description / name such as "Breakfast" or "after workout"
          maxLength: 25
      required:
      - plan
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
