      - in: query
        name: rir__gt
        schema:
          type: number
      - in: query
        name: rir__gte
        schema:
          type: number
      - in: query
        name: rir__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: rir__lt
        schema:
          type: number
      - in: query
        name: rir__lte
