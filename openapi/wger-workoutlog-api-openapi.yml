      tags:
      - workoutlog
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkoutLogList'
          description: ''
      summary: Workoutlog list
      x-summary-source: derived
    post:
      operationId: workoutlog_create
      description: API endpoint for workout log objects
      tags:
      - workoutlog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutLogRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutLog'
          description: ''
      summary: Workoutlog create
      x-summary-source: derived
  /api/v2/workoutlog/{id}/:
    get:
      operationId: workoutlog_retrieve
      description: API endpoint for workout log objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this workout log.
        required: true
      tags:
      - workoutlog
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutLog'
          description: ''
      summary: Workoutlog retrieve
      x-summary-source: derived
    put:
      operationId: workoutlog_update
      description: API endpoint for workout log objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this workout log.
        required: true
      tags:
      - workoutlog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutLogRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutLog'
          description: ''
      summary: Workoutlog update
      x-summary-source: derived
    patch:
      operationId: workoutlog_partial_update
      description: API endpoint for workout log objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this workout log.
        required: true
      tags:
      - workoutlog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkoutLogRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutLog'
          description: ''
      summary: Workoutlog partial update
      x-summary-source: derived
    delete:
      operationId: workoutlog_destroy
      description: API endpoint for workout log objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this workout log.
        required: true
      tags:
      - workoutlog
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Workoutlog destroy
      x-summary-source: derived
components:
  schemas:
    PatchedWorkoutLogRequest:
      type: object
      description: Workout log serializer
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        session:
          type:
          - string
          - 'null'
          format: uuid
        routine:
          type:
          - integer
          - 'null'
          title: Workout
        iteration:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
        slot_entry:
          type:
          - integer
          - 'null'
        next_log:
          type:
          - string
          - 'null'
          format: uuid
        exercise:
          type: integer
        repetitions_unit:
          type:
          - integer
          - 'null'
        repetitions:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        repetitions_target:
          type:
