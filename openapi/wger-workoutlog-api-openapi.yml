          - 'null'
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        rest:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
        rest_target:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
