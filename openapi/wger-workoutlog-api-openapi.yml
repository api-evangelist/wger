          format: date-time
      - in: query
        name: date__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: exercise
        schema:
          type: integer
      - in: query
        name: exercise__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: iteration
        schema:
          type: integer
      - in: query
        name: iteration__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: repetitions
        schema:
          type: number
      - in: query
        name: repetitions__gt
        schema:
          type: number
      - in: query
        name: repetitions__gte
        schema:
          type: number
      - in: query
        name: repetitions__lt
        schema:
          type: number
      - in: query
        name: repetitions__lte
        schema:
          type: number
      - in: query
        name: repetitions_target
        schema:
          type: number
      - in: query
        name: repetitions_target__gt
