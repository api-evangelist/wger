openapi: 3.2.0
info:
  title: wger Exercise Translation API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: exercise-translation
paths:
  /api/v2/exercise-translation/:
    get:
      operationId: exercise_translation_list
      description: API endpoint for editing or adding exercise translation objects.
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: exercise
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: uuid
        schema:
          type: string
          format: uuid
      tags:
      - exercise-translation
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseTranslationList'
          description: ''
      summary: Exercise translation list
      x-summary-source: derived
    post:
      operationId: exercise_translation_create
      description: API endpoint for editing or adding exercise translation objects.
      tags:
      - exercise-translation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseTranslationRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseTranslation'
          description: ''
      summary: Exercise translation create
      x-summary-source: derived
  /api/v2/exercise-translation/{id}/:
    get:
      operationId: exercise_translation_retrieve
      description: API endpoint for editing or adding exercise translation objects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this translation.
        required: true
      tags:
      - exercise-translation
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseTranslation'
          description: ''
      summary: Exercise translation retrieve
      x-summary-source: derived
    put:
      operationId: exercise_translation_update
      description: API endpoint for editing or adding exercise translation objects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this translation.
        required: true
      tags:
      - exercise-translation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseTranslationRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseTranslation'
          description: ''
      summary: Exercise translation update
      x-summary-source: derived
    patch:
      operationId: exercise_translation_partial_update
      description: API endpoint for editing or adding exercise translation objects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this translation.
        required: true
      tags:
      - exercise-translation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExerciseTranslationRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseTranslation'
          description: ''
      summary: Exercise translation partial update
      x-summary-source: derived
    delete:
      operationId: exercise_translation_destroy
      description: API endpoint for editing or adding exercise translation objects.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this translation.
        required: true
      tags:
      - exercise-translation
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Exercise translation destroy
      x-summary-source: derived
components:
  schemas:
    PaginatedExerciseTranslationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseTranslation'
    PatchedExerciseTranslationRequest:
      type: object
      description: Exercise translation serializer
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        exercise:
          type: integer
        description_source:
          type: string
          minLength: 40
          title: Description (Source)
        language:
          type: integer
        license_author:
          type: string
          title: Author(s)
          description: If you are not the author, enter the name or source here.
          maxLength: 3500
    ExerciseTranslation:
      type: object
      description: Exercise translation serializer
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        exercise:
          type: integer
        description:
          type: string
          readOnly: true
        description_source:
          type: string
          title: Description (Source)
          minLength: 40
        created:
          type: string
          format: date-time
          readOnly: true
          title: Date
        language:
          type: integer
        license_author:
          type: string
          title: Author(s)
          description: If you are not the author, enter the name or source here.
          maxLength: 3500
      required:
      - created
      - description
      - description_source
      - exercise
      - id
      - language
      - name
      - uuid
    ExerciseTranslationRequest:
      type: object
      description: Exercise translation serializer
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        exercise:
          type: integer
        description_source:
          type: string
          minLength: 40
          title: Description (Source)
        language:
          type: integer
        license_author:
          type: string
          title: Author(s)
          description: If you are not the author, enter the name or source here.
          maxLength: 3500
      required:
      - description_source
      - exercise
      - language
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
