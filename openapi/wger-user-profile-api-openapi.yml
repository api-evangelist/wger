openapi: 3.2.0
info:
  title: wger Userprofile API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: User Profile
paths:
  /api/v2/userprofile/:
    get:
      operationId: userprofile_retrieve
      description: 'API endpoint for the user profile


        Every user has exactly one profile, so this endpoint has no list and no

        detail route: it always reads and writes the profile of the logged-in user.

        Updating it takes a PATCH since wger 2.7; up to 2.6 it took a POST.'
      tags:
      - User Profile
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Userprofile'
          description: ''
      summary: Userprofile retrieve
      x-summary-source: derived
    post:
      operationId: userprofile_update_legacy
      description: 'Updates the profile of the logged-in user, exactly like PATCH does.


        Use this if your client needs to work with wger 2.6 or older, which accept only POST on this endpoint. Servers from 2.7 on accept both, so prefer PATCH in this case.'
      summary: Update the profile of servers up to wger 2.6
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserprofileRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Userprofile'
          description: ''
    put:
      operationId: userprofile_update
      description: 'API endpoint for the user profile


        Every user has exactly one profile, so this endpoint has no list and no

        detail route: it always reads and writes the profile of the logged-in user.

        Updating it takes a PATCH since wger 2.7; up to 2.6 it took a POST.'
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserprofileRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Userprofile'
          description: ''
      summary: Userprofile update
      x-summary-source: derived
    patch:
      operationId: userprofile_partial_update
      description: 'API endpoint for the user profile


        Every user has exactly one profile, so this endpoint has no list and no

        detail route: it always reads and writes the profile of the logged-in user.

        Updating it takes a PATCH since wger 2.7; up to 2.6 it took a POST.'
      tags:
      - User Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserprofileRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Userprofile'
          description: ''
      summary: Userprofile partial update
      x-summary-source: derived
  /api/v2/userprofile/verify-email/:
    post:
      operationId: userprofile_verify_email_create
      description: 'Verify the user''s email address


        POST only, a GET must not send out emails as a side effect'
      tags:
      - User Profile
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: ''
      summary: Userprofile verify email create
      x-summary-source: derived
components:
  schemas:
    GenderEnum:
      enum:
      - '1'
      - '2'
      type: string
      description: '* `1` - Male

        * `2` - Female'
    NullEnum:
      enum:
      - null
    WeightUnitEnum:
      enum:
      - kg
      - lb
      type: string
      description: '* `kg` - Metric (kilogram)

        * `lb` - Imperial (pound)'
    PatchedUserprofileRequest:
      type: object
      description: Workout session serializer
      properties:
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        repetitions_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        workout_reminder_active:
          type: boolean
          title: Activate workout reminders
          description: Check to activate automatic reminders for workouts. You need to provide a valid email for this to work.
        workout_reminder:
          type: integer
          maximum: 30
          minimum: 1
          title: Remind before expiration
          description: The number of days you want to be reminded before a workout expires.
        workout_duration:
          type: integer
          maximum: 30
          minimum: 1
          title: Default duration of workouts
          description: Default duration in weeks of workouts not in a schedule. Used for email workout reminders.
        notification_language:
          type: integer
          description: Language to use when sending you email notifications, e.g. email reminders for workouts. This does not affect the language used on the website.
        age:
          type:
          - integer
          - 'null'
          maximum: 100
          minimum: 10
        birthdate:
          type:
          - string
          - 'null'
          format: date
          title: Date of Birth
        height:
          type:
          - integer
          - 'null'
          maximum: 230
          minimum: 140
          title: Height (cm)
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/NullEnum'
        sleep_hours:
          type:
          - integer
          - 'null'
          maximum: 10
          minimum: 4
          title: Hours of sleep
          description: The average hours of sleep per day
        work_hours:
          type:
          - integer
          - 'null'
          maximum: 15
          minimum: 1
          title: Work
          description: Average hours per day
        work_intensity:
          title: Physical intensity
          description: 'Approximately


            * `1` - Low

            * `2` - Medium

            * `3` - High'
          oneOf:
          - $ref: '#/components/schemas/IntensityEnum'
          - $ref: '#/components/schemas/NullEnum'
        sport_hours:
          type:
          - integer
          - 'null'
          maximum: 30
          minimum: 1
          title: Sport
          description: Average hours per week
        sport_intensity:
          title: Physical intensity
          description: 'Approximately


            * `1` - Low

            * `2` - Medium

            * `3` - High'
          oneOf:
          - $ref: '#/components/schemas/IntensityEnum'
          - $ref: '#/components/schemas/NullEnum'
        freetime_hours:
          type:
          - integer
          - 'null'
          maximum: 15
          minimum: 1
          title: Free time
          description: Average hours per day
        freetime_intensity:
          title: Physical intensity
          description: 'Approximately


            * `1` - Low

            * `2` - Medium

            * `3` - High'
          oneOf:
          - $ref: '#/components/schemas/IntensityEnum'
          - $ref: '#/components/schemas/NullEnum'
        calories:
          type:
          - integer
          - 'null'
          maximum: 5000
          minimum: 1500
          title: Total daily calories
          description: Total caloric intake, including e.g. any surplus
        weight_unit:
          $ref: '#/components/schemas/WeightUnitEnum'
        num_days_weight_reminder:
          type: integer
          maximum: 30
          minimum: 0
          title: Automatic reminders for weight entries
          description: Number of days after the last weight entry (enter 0 to deactivate)
    IntensityEnum:
      enum:
      - '1'
      - '2'
      - '3'
      type: string
      description: '* `1` - Low

        * `2` - Medium

        * `3` - High'
    VerifyEmailResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: string
        message:
          type: string
      required:
      - message
    Userprofile:
      type: object
      description: Workout session serializer
      properties:
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        is_trustworthy:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        gym:
          type:
          - integer
          - 'null'
          readOnly: true
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        repetitions_rounding:
