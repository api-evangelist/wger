openapi: 3.2.0
info:
  title: wger Weightentry API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: weightentry
paths:
  /api/v2/weightentry/:
    get:
      operationId: weightentry_list
      description: API endpoint for nutrition plan objects
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date-time
      - in: query
        name: date__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: date__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: date__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: weight
        schema:
          type: number
      - in: query
        name: weight__gt
        schema:
          type: number
      - in: query
        name: weight__gte
        schema:
          type: number
      - in: query
        name: weight__lt
        schema:
          type: number
      - in: query
        name: weight__lte
        schema:
          type: number
      tags:
      - weightentry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWeightEntryList'
          description: ''
      summary: Weightentry list
      x-summary-source: derived
    post:
      operationId: weightentry_create
      description: API endpoint for nutrition plan objects
      tags:
      - weightentry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightEntry'
          description: ''
      summary: Weightentry create
      x-summary-source: derived
  /api/v2/weightentry/{id}/:
    get:
      operationId: weightentry_retrieve
      description: API endpoint for nutrition plan objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Weight entry.
        required: true
      tags:
      - weightentry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightEntry'
          description: ''
      summary: Weightentry retrieve
      x-summary-source: derived
    put:
      operationId: weightentry_update
      description: API endpoint for nutrition plan objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Weight entry.
        required: true
      tags:
      - weightentry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightEntryRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightEntry'
          description: ''
      summary: Weightentry update
      x-summary-source: derived
    patch:
      operationId: weightentry_partial_update
      description: API endpoint for nutrition plan objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Weight entry.
        required: true
      tags:
      - weightentry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWeightEntryRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightEntry'
          description: ''
      summary: Weightentry partial update
      x-summary-source: derived
    delete:
      operationId: weightentry_destroy
      description: API endpoint for nutrition plan objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Weight entry.
        required: true
      tags:
      - weightentry
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Weightentry destroy
      x-summary-source: derived
components:
  schemas:
    WeightEntry:
      type: object
      description: Weight serializer
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date-time
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        user:
          type: integer
          readOnly: true
      required:
      - date
      - id
      - user
      - weight
    WeightEntryRequest:
      type: object
      description: Weight serializer
      properties:
        date:
          type: string
          format: date-time
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - date
      - weight
    PaginatedWeightEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/WeightEntry'
    PatchedWeightEntryRequest:
      type: object
      description: Weight serializer
      properties:
        date:
          type: string
          format: date-time
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
