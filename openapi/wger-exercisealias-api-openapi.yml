openapi: 3.2.0
info:
  title: wger Exercisealias API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: exercisealias
paths:
  /api/v2/exercisealias/:
    get:
      operationId: exercisealias_list
      description: API endpoint for exercise aliases objects
      parameters:
      - in: query
        name: alias
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: translation
        schema:
          type: integer
      tags:
      - exercisealias
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseAliasList'
          description: ''
      summary: Exercisealias list
      x-summary-source: derived
    post:
      operationId: exercisealias_create
      description: API endpoint for exercise aliases objects
      tags:
      - exercisealias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseAliasRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAlias'
          description: ''
      summary: Exercisealias create
      x-summary-source: derived
  /api/v2/exercisealias/{id}/:
    get:
      operationId: exercisealias_retrieve
      description: API endpoint for exercise aliases objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alias.
        required: true
      tags:
      - exercisealias
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAlias'
          description: ''
      summary: Exercisealias retrieve
      x-summary-source: derived
    put:
      operationId: exercisealias_update
      description: API endpoint for exercise aliases objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alias.
        required: true
      tags:
      - exercisealias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseAliasRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAlias'
          description: ''
      summary: Exercisealias update
      x-summary-source: derived
    patch:
      operationId: exercisealias_partial_update
      description: API endpoint for exercise aliases objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alias.
        required: true
      tags:
      - exercisealias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExerciseAliasRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseAlias'
          description: ''
      summary: Exercisealias partial update
      x-summary-source: derived
    delete:
      operationId: exercisealias_destroy
      description: API endpoint for exercise aliases objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alias.
        required: true
      tags:
      - exercisealias
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Exercisealias destroy
      x-summary-source: derived
components:
  schemas:
    ExerciseAliasRequest:
      type: object
      description: ExerciseAlias serializer
      properties:
        translation:
          type: integer
          title: Exercise
        alias:
          type: string
          minLength: 1
          title: Alias for an exercise
          maxLength: 200
      required:
      - alias
      - translation
    ExerciseAlias:
      type: object
      description: ExerciseAlias serializer
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        translation:
          type: integer
          title: Exercise
        alias:
          type: string
          title: Alias for an exercise
          maxLength: 200
      required:
      - alias
      - id
      - translation
      - uuid
    PatchedExerciseAliasRequest:
      type: object
      description: ExerciseAlias serializer
      properties:
        translation:
          type: integer
          title: Exercise
        alias:
          type: string
          minLength: 1
          title: Alias for an exercise
          maxLength: 200
    PaginatedExerciseAliasList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseAlias'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
