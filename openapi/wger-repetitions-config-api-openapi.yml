openapi: 3.2.0
info:
  title: wger Repetitions Config API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: repetitions-config
  description: Repetitions for a set, per iteration.
paths:
  /api/v2/repetitions-config/:
    get:
      operationId: repetitions_config_list
      description: API endpoint for reps config objects
      parameters:
      - in: query
        name: id
        schema:
          type: integer
      - in: query
        name: iteration
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: operation
        schema:
          type: string
          enum:
          - +
          - '-'
          - r
        description: '* `+` - Plus

          * `-` - Minus

          * `r` - Replace'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: repeat
        schema:
          type: boolean
      - in: query
        name: slot_entry
        schema:
          type: integer
      - in: query
        name: step
        schema:
          type: string
          enum:
          - abs
          - na
          - percent
        description: '* `na` - Not Applicable

          * `abs` - Absolute

          * `percent` - Percent'
      - in: query
        name: value
        schema:
          type: number
      tags:
      - repetitions-config
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepetitionsConfigList'
          description: ''
      summary: Repetitions config list
      x-summary-source: derived
    post:
      operationId: repetitions_config_create
      description: API endpoint for reps config objects
      tags:
      - repetitions-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepetitionsConfigRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepetitionsConfig'
          description: ''
      summary: Repetitions config create
      x-summary-source: derived
  /api/v2/repetitions-config/{id}/:
    get:
      operationId: repetitions_config_retrieve
      description: API endpoint for reps config objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this repetitions config.
        required: true
      tags:
      - repetitions-config
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepetitionsConfig'
          description: ''
      summary: Repetitions config retrieve
      x-summary-source: derived
    put:
      operationId: repetitions_config_update
      description: API endpoint for reps config objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this repetitions config.
        required: true
      tags:
      - repetitions-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepetitionsConfigRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepetitionsConfig'
          description: ''
      summary: Repetitions config update
      x-summary-source: derived
    patch:
      operationId: repetitions_config_partial_update
      description: API endpoint for reps config objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this repetitions config.
        required: true
      tags:
      - repetitions-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRepetitionsConfigRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepetitionsConfig'
          description: ''
      summary: Repetitions config partial update
      x-summary-source: derived
    delete:
      operationId: repetitions_config_destroy
      description: API endpoint for reps config objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this repetitions config.
        required: true
      tags:
      - repetitions-config
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Repetitions config destroy
      x-summary-source: derived
components:
  schemas:
    PaginatedRepetitionsConfigList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/RepetitionsConfig'
    StepEnum:
      enum:
      - na
      - abs
      - percent
      type: string
      description: '* `na` - Not Applicable

        * `abs` - Absolute

        * `percent` - Percent'
    OperationEnum:
      enum:
      - +
      - '-'
      - r
      type: string
      description: '* `+` - Plus

        * `-` - Minus

        * `r` - Replace'
    RepetitionsConfigRequest:
      type: object
      description: Repetition Config serializer
      properties:
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - iteration
      - slot_entry
      - value
    PatchedRepetitionsConfigRequest:
      type: object
      description: Repetition Config serializer
      properties:
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
    RepetitionsConfig:
      type: object
      description: Repetition Config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
