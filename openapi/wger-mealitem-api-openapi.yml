openapi: 3.2.0
info:
  title: wger Mealitem API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: mealitem
paths:
  /api/v2/mealitem/:
    get:
      operationId: mealitem_list
      description: API endpoint for meal item objects
      parameters:
      - in: query
        name: amount
        schema:
          type: number
      - in: query
        name: ingredient
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: meal
        schema:
          type: string
          format: uuid
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: weight_unit
        schema:
          type: integer
      tags:
      - mealitem
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMealItemList'
          description: ''
      summary: Mealitem list
      x-summary-source: derived
    post:
      operationId: mealitem_create
      description: API endpoint for meal item objects
      tags:
      - mealitem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealItem'
          description: ''
      summary: Mealitem create
      x-summary-source: derived
  /api/v2/mealitem/{id}/:
    get:
      operationId: mealitem_retrieve
      description: API endpoint for meal item objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal item.
        required: true
      tags:
      - mealitem
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealItem'
          description: ''
      summary: Mealitem retrieve
      x-summary-source: derived
    put:
      operationId: mealitem_update
      description: API endpoint for meal item objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal item.
        required: true
      tags:
      - mealitem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealItem'
          description: ''
      summary: Mealitem update
      x-summary-source: derived
    patch:
      operationId: mealitem_partial_update
      description: API endpoint for meal item objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal item.
        required: true
      tags:
      - mealitem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMealItemRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealItem'
          description: ''
      summary: Mealitem partial update
      x-summary-source: derived
    delete:
      operationId: mealitem_destroy
      description: API endpoint for meal item objects
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal item.
        required: true
      tags:
      - mealitem
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Mealitem destroy
      x-summary-source: derived
  /api/v2/mealitem/{id}/nutritional_values/:
    get:
      operationId: mealitem_nutritional_values_retrieve
      description: Return an overview of the nutritional plan's values
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this meal item.
        required: true
      tags:
      - mealitem
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionalValues'
          description: ''
      summary: Mealitem nutritional values retrieve
      x-summary-source: derived
components:
  schemas:
    MealItemRequest:
      type: object
      description: MealItem serializer
      properties:
        id:
          type: string
          format: uuid
        meal:
          type: string
          format: uuid
          title: Nutrition plan
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      required:
      - amount
      - ingredient
      - meal
    PaginatedMealItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MealItem'
    MealItem:
      type: object
      description: MealItem serializer
      properties:
        id:
          type: string
          format: uuid
        meal:
          type: string
          format: uuid
          title: Nutrition plan
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        order:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      required:
      - amount
      - ingredient
      - meal
      - order
    NutritionalValues:
      type: object
      description: Nutritional values serializer
      properties:
        energy:
          type: number
          format: double
        protein:
          type: number
          format: double
        carbohydrates:
          type: number
          format: double
        carbohydrates_sugar:
          type:
          - number
          - 'null'
          format: double
        fat:
          type: number
          format: double
        fat_saturated:
          type:
          - number
          - 'null'
          format: double
        fiber:
          type:
          - number
          - 'null'
          format: double
        sodium:
          type:
          - number
          - 'null'
          format: double
      required:
      - carbohydrates
      - carbohydrates_sugar
      - energy
      - fat
      - fat_saturated
      - fiber
      - protein
      - sodium
    PatchedMealItemRequest:
      type: object
      description: MealItem serializer
      properties:
        id:
          type: string
          format: uuid
        meal:
          type: string
          format: uuid
          title: Nutrition plan
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
