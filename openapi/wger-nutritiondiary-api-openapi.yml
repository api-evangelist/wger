openapi: 3.2.0
info:
  title: wger Nutritiondiary API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: nutritiondiary
paths:
  /api/v2/nutritiondiary/:
    get:
      operationId: nutritiondiary_list
      description: API endpoint for a meal log item
      parameters:
      - in: query
        name: amount
        schema:
          type: number
      - in: query
        name: datetime
        schema:
          type: string
          format: date-time
      - in: query
        name: datetime__date
        schema:
          type: string
          format: date
      - in: query
        name: datetime__gt
        schema:
          type: string
          format: date-time
      - in: query
        name: datetime__gte
        schema:
          type: string
          format: date-time
      - in: query
        name: datetime__lt
        schema:
          type: string
          format: date-time
      - in: query
        name: datetime__lte
        schema:
          type: string
          format: date-time
      - in: query
        name: ingredient
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: plan
        schema:
          type: string
          format: uuid
      - in: query
        name: weight_unit
        schema:
          type: integer
      tags:
      - nutritiondiary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogItemList'
          description: ''
      summary: Nutritiondiary list
      x-summary-source: derived
    post:
      operationId: nutritiondiary_create
      description: API endpoint for a meal log item
      tags:
      - nutritiondiary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogItem'
          description: ''
      summary: Nutritiondiary create
      x-summary-source: derived
  /api/v2/nutritiondiary/{id}/:
    get:
      operationId: nutritiondiary_retrieve
      description: API endpoint for a meal log item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this log item.
        required: true
      tags:
      - nutritiondiary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogItem'
          description: ''
      summary: Nutritiondiary retrieve
      x-summary-source: derived
    put:
      operationId: nutritiondiary_update
      description: API endpoint for a meal log item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this log item.
        required: true
      tags:
      - nutritiondiary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogItemRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogItem'
          description: ''
      summary: Nutritiondiary update
      x-summary-source: derived
    patch:
      operationId: nutritiondiary_partial_update
      description: API endpoint for a meal log item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this log item.
        required: true
      tags:
      - nutritiondiary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLogItemRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogItem'
          description: ''
      summary: Nutritiondiary partial update
      x-summary-source: derived
    delete:
      operationId: nutritiondiary_destroy
      description: API endpoint for a meal log item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this log item.
        required: true
      tags:
      - nutritiondiary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Nutritiondiary destroy
      x-summary-source: derived
  /api/v2/nutritiondiary/{id}/nutritional_values/:
    get:
      operationId: nutritiondiary_nutritional_values_retrieve
      description: Return an overview of the nutritional plan's values
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this log item.
        required: true
      tags:
      - nutritiondiary
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionalValues'
          description: ''
      summary: Nutritiondiary nutritional values retrieve
      x-summary-source: derived
components:
  schemas:
    LogItemRequest:
      type: object
      description: LogItem serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        meal:
          type:
          - string
          - 'null'
          format: uuid
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        datetime:
          type: string
          format: date-time
          title: Date and Time (Approx.)
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      required:
      - amount
      - ingredient
      - plan
    LogItem:
      type: object
      description: LogItem serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        meal:
          type:
          - string
          - 'null'
          format: uuid
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        datetime:
          type: string
          format: date-time
          title: Date and Time (Approx.)
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
      required:
      - amount
      - ingredient
      - plan
    PaginatedLogItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/LogItem'
    NutritionalValues:
      type: object
      description: Nutritional values serializer
      properties:
        energy:
          type: number
          format: double
        protein:
          type: number
          format: double
        carbohydrates:
          type: number
          format: double
        carbohydrates_sugar:
          type:
          - number
          - 'null'
          format: double
        fat:
          type: number
          format: double
        fat_saturated:
          type:
          - number
          - 'null'
          format: double
        fiber:
          type:
          - number
          - 'null'
          format: double
        sodium:
          type:
          - number
          - 'null'
          format: double
      required:
      - carbohydrates
      - carbohydrates_sugar
      - energy
      - fat
      - fat_saturated
      - fiber
      - protein
      - sodium
    PatchedLogItemRequest:
      type: object
      description: LogItem serializer
      properties:
        id:
          type: string
          format: uuid
        plan:
          type: string
          format: uuid
          title: Nutrition plan
        meal:
          type:
          - string
          - 'null'
          format: uuid
        ingredient:
          type: integer
        weight_unit:
          type:
          - integer
          - 'null'
        datetime:
          type: string
          format: date-time
          title: Date and Time (Approx.)
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
