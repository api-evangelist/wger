openapi: 3.2.0
info:
  title: wger Exercisecomment API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: exercisecomment
paths:
  /api/v2/exercisecomment/:
    get:
      operationId: exercisecomment_list
      description: API endpoint for exercise comment objects
      parameters:
      - in: query
        name: comment
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: translation
        schema:
          type: integer
      tags:
      - exercisecomment
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseCommentList'
          description: ''
      summary: Exercisecomment list
      x-summary-source: derived
    post:
      operationId: exercisecomment_create
      description: API endpoint for exercise comment objects
      tags:
      - exercisecomment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCommentRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseComment'
          description: ''
      summary: Exercisecomment create
      x-summary-source: derived
  /api/v2/exercisecomment/{id}/:
    get:
      operationId: exercisecomment_retrieve
      description: API endpoint for exercise comment objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise comment.
        required: true
      tags:
      - exercisecomment
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseComment'
          description: ''
      summary: Exercisecomment retrieve
      x-summary-source: derived
    put:
      operationId: exercisecomment_update
      description: API endpoint for exercise comment objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise comment.
        required: true
      tags:
      - exercisecomment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCommentRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseComment'
          description: ''
      summary: Exercisecomment update
      x-summary-source: derived
    patch:
      operationId: exercisecomment_partial_update
      description: API endpoint for exercise comment objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise comment.
        required: true
      tags:
      - exercisecomment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExerciseCommentRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseComment'
          description: ''
      summary: Exercisecomment partial update
      x-summary-source: derived
    delete:
      operationId: exercisecomment_destroy
      description: API endpoint for exercise comment objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise comment.
        required: true
      tags:
      - exercisecomment
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Exercisecomment destroy
      x-summary-source: derived
components:
  schemas:
    ExerciseComment:
      type: object
      description: ExerciseComment serializer
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        translation:
          type: integer
          title: Exercise
        comment:
          type: string
          description: A comment about how to correctly do this exercise.
          maxLength: 200
      required:
      - comment
      - id
      - translation
      - uuid
    ExerciseCommentRequest:
      type: object
      description: ExerciseComment serializer
      properties:
        translation:
          type: integer
          title: Exercise
        comment:
          type: string
          minLength: 1
          description: A comment about how to correctly do this exercise.
          maxLength: 200
      required:
      - comment
      - translation
    PatchedExerciseCommentRequest:
      type: object
      description: ExerciseComment serializer
      properties:
        translation:
          type: integer
          title: Exercise
        comment:
          type: string
          minLength: 1
          description: A comment about how to correctly do this exercise.
          maxLength: 200
    PaginatedExerciseCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseComment'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
