openapi: 3.2.0
info:
  title: wger Setting Repetitionunit API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: setting-repetitionunit
paths:
  /api/v2/setting-repetitionunit/:
    get:
      operationId: setting_repetitionunit_list
      description: API endpoint for repetition units objects
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - setting-repetitionunit
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepetitionUnitList'
          description: ''
      summary: Setting repetitionunit list
      x-summary-source: derived
  /api/v2/setting-repetitionunit/{id}/:
    get:
      operationId: setting_repetitionunit_retrieve
      description: API endpoint for repetition units objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this repetition unit.
        required: true
      tags:
      - setting-repetitionunit
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepetitionUnit'
          description: ''
      summary: Setting repetitionunit retrieve
      x-summary-source: derived
components:
  schemas:
    UnitTypeEnum:
      enum:
      - REPETITIONS
      - TIME
      - DISTANCE
      type: string
      description: '* `REPETITIONS` - Repetitions

        * `TIME` - Time

        * `DISTANCE` - Distance'
    RepetitionUnit:
      type: object
      description: Repetition unit serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        unit_type:
          allOf:
          - $ref: '#/components/schemas/UnitTypeEnum'
          description: 'The type of unit (repetitions, time, or distance)


            * `REPETITIONS` - Repetitions

            * `TIME` - Time

            * `DISTANCE` - Distance'
        multiplier:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: "Multiplier to convert this unit to a base unit. Time units are converted\n        to seconds, distance units to meters, and repetitions remain unchanged. For example:\n        minutes -> 60, kilometers -> 1000. Leave empty if a multiplier does not apply."
      required:
      - id
      - name
    PaginatedRepetitionUnitList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/RepetitionUnit'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
