openapi: 3.2.0
info:
  title: wger Routine API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: routine
  description: Workout routines. The nested day, slot and config structure is available in one request under `/routine/{id}/structure/`.
paths:
  /api/v2/routine/:
    get:
      operationId: routine_list
      description: API endpoint for routine objects
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoutineList'
          description: ''
      summary: Routine list
      x-summary-source: derived
    post:
      operationId: routine_create
      description: API endpoint for routine objects
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
      summary: Routine create
      x-summary-source: derived
  /api/v2/routine/{id}/:
    get:
      operationId: routine_retrieve
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
      summary: Routine retrieve
      x-summary-source: derived
    put:
      operationId: routine_update
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
      summary: Routine update
      x-summary-source: derived
    patch:
      operationId: routine_partial_update
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoutineRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
      summary: Routine partial update
      x-summary-source: derived
    delete:
      operationId: routine_destroy
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
      summary: Routine destroy
      x-summary-source: derived
  /api/v2/routine/{id}/date-sequence-display/:
    get:
      operationId: routine_date_sequence_display_list
      description: Return the day sequence of the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutDayDataDisplayMode'
          description: ''
      summary: Routine date sequence display list
      x-summary-source: derived
  /api/v2/routine/{id}/date-sequence-gym/:
    get:
      operationId: routine_date_sequence_gym_list
      description: Return the day sequence of the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutDayDataGymMode'
          description: ''
      summary: Routine date sequence gym list
      x-summary-source: derived
  /api/v2/routine/{id}/logs/:
    get:
      operationId: routine_logs_list
      description: Returns the logs for the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogDisplay'
          description: ''
      summary: Routine logs list
      x-summary-source: derived
  /api/v2/routine/{id}/stats/:
    get:
      operationId: routine_stats_retrieve
      description: Returns the logs for the routine
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogStatsData'
          description: ''
      summary: Routine stats retrieve
      x-summary-source: derived
  /api/v2/routine/{id}/structure/:
    get:
      operationId: routine_structure_retrieve
      description: Return the full object structure of the routine.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineStructure'
          description: ''
      summary: Routine structure retrieve
      x-summary-source: derived
components:
  schemas:
    RoutineStructure:
      type: object
      description: Routine structure serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        created:
          type: string
          format: date-time
          readOnly: true
          title: Creation date
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayStructure'
      required:
      - created
      - days
      - end
      - id
      - start
    PatchedRoutineRequest:
      type: object
      description: Routine serializer
      properties:
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        is_template:
          type: boolean
          title: Workout template
          description: Marking a workout as a template will freeze it and allow you to make copies of it
        is_public:
          type: boolean
          title: Public template
          description: A public template is available to other users
    StepEnum:
      enum:
      - na
      - abs
      - percent
      type: string
      description: '* `na` - Not Applicable

        * `abs` - Absolute

        * `percent` - Percent'
    ImpressionEnum:
      enum:
      - '1'
      - '2'
      - '3'
      type: string
      description: '* `1` - Bad

        * `2` - Neutral

        * `3` - Good'
    MaxRiRConfig:
      type: object
      description: RiR Config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    ExerciseTypeEnum:
      enum:
      - normal
      - warmup
      - dropset
      - myo
      - partial
      - forced
      - tut
      - iso
      - jump
      type: string
      description: '* `normal` - Normal

        * `warmup` - Warmup

        * `dropset` - Dropset

        * `myo` - Myo

        * `partial` - Partial

        * `forced` - Forced

        * `tut` - Tut

        * `iso` - Iso Hold

        * `jump` - Jump'
    LogStatsData:
      type: object
      description: Log Stats Data serializer
      properties:
        intensity:
          $ref: '#/components/schemas/GroupedLogData'
        sets:
          $ref: '#/components/schemas/GroupedLogData'
        volume:
          $ref: '#/components/schemas/GroupedLogData'
      required:
      - intensity
      - sets
      - volume
    GroupedLogData:
      type: object
      description: Log Stats Data serializer
      properties:
        iteration:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        weekly:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        daily:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        mesocycle:
          $ref: '#/components/schemas/LogData'
      required:
      - daily
      - iteration
      - mesocycle
      - weekly
    Routine:
      type: object
      description: Routine serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        created:
          type: string
          format: date-time
          readOnly: true
          title: Creation date
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        is_template:
          type: boolean
          title: Workout template
          description: Marking a workout as a template will freeze it and allow you to make copies of it
        is_public:
          type: boolean
          title: Public template
          description: A public template is available to other users
      required:
      - created
      - end
      - id
      - start
    SetNrConfig:
      type: object
      description: Set Nr config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: integer
          maximum: 50
          minimum: 0
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    DayTypeEnum:
      enum:
      - custom
      - enom
      - amrap
      - hiit
      - tabata
      - edt
      - rft
      - afap
      type: string
      description: '* `custom` - Custom

        * `enom` - Enom

        * `amrap` - Amrap

        * `hiit` - Hiit

        * `tabata` - Tabata

        * `edt` - Edt

        * `rft` - Rft

        * `afap` - Afap'
    LogDisplay:
      type: object
      description: Log Display Data serializer
      properties:
        session:
          $ref: '#/components/schemas/WorkoutSession'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutLog'
      required:
      - logs
      - session
    SlotData:
      type: object
      description: Slot Data serializer
      properties:
        comment:
          type: string
        is_superset:
          type: boolean
        exercises:
          type: array
          items:
            type: integer
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetConfigData'
      required:
      - comment
      - exercises
      - is_superset
      - sets
    WorkoutDayDataGymMode:
      type: object
      description: WorkoutDayData serializer - gym mode
      properties:
        iteration:
          type: integer
        date:
          type: string
          format: date
        label:
          type: string
        day:
          $ref: '#/components/schemas/Day'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotData'
      required:
      - date
      - day
      - iteration
      - label
      - slots
    SetConfigData:
      type: object
      description: SetConfigData serializer
      properties:
        slot_entry_id:
          type: integer
        exercise:
          type: integer
        sets:
          type: integer
        max_sets:
          type:
          - integer
          - 'null'
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        max_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight_unit:
          type:
          - integer
          - 'null'
        weight_rounding:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        repetitions:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        max_repetitions:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        repetitions_unit:
          type:
          - integer
          - 'null'
        repetitions_rounding:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        rir:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        max_rir:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        rpe:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
        rest:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        max_rest:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        type:
          type: string
        text_repr:
          type: string
        comment:
          type: string
      required:
      - comment
      - exercise
      - max_repetitions
      - max_rest
      - max_rir
      - max_sets
      - max_weight
      - repetitions
      - repetitions_rounding
      - repetitions_unit
      - rest
      - rir
      - rpe
      - sets
      - slot_entry_id
      - text_repr
      - type
      - weight
      - weight_rounding
      - weight_unit
    SlotStructure:
      type: object
      description: Slot
      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: integer
          title: Exercise day
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 200
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SlotEntryStructure'
        config: {}
      required:
      - day
      - entries
      - id
    MaxSetNrConfig:
      type: object
      description: Max Set Nr config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: integer
          maximum: 50
          minimum: 0
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    RoutineRequest:
      type: object
      description: Routine serializer
      properties:
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        is_template:
          type: boolean
          title: Workout template
          description: Marking a workout as a template will freeze it and allow you to make copies of it
        is_public:
          type: boolean
          title: Public template
          description: A public template is available to other users
      required:
      - end
      - start
    OperationEnum:
      enum:
      - +
      - '-'
      - r
      type: string
      description: '* `+` - Plus

        * `-` - Minus

        * `r` - Replace'
    WorkoutDayDataDisplayMode:
      type: object
      description: WorkoutDayData serializer - display mode
      properties:
        iteration:
          type: integer
        date:
          type: string
          format: date
        label:
          type: string
        day:
          $ref: '#/components/schemas/Day'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotData'
      required:
      - date
      - day
      - iteration
      - label
      - slots
    WorkoutSession:
      type: object
      description: Workout session serializer
      properties:
        id:
          type: string
          format: uuid
        routine:
          type:
          - integer
          - 'null'
        day:
          type:
          - integer
          - 'null'
        date:
          type: string
          format: date
        notes:
          type:
          - string
          - 'null'
          description: Any notes you might want to save about this workout session.
        impression:
          allOf:
          - $ref: '#/components/schemas/ImpressionEnum'
          title: General impression
          description: 'Your impression about this workout session. Did you exercise as well as you could?


            * `1` - Bad

            * `2` - Neutral

            * `3` - Good'
        time_start:
          type:
          - string
          - 'null'
          format: time
          title: Start time
        time_end:
          type:
          - string
          - 'null'
          format: time
          title: Finish time
    DayStructure:
      type: object
      description: Day serializer
      properties:
        id:
          type: integer
          readOnly: true
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        is_rest:
          type: boolean
        need_logs_to_advance:
          type: boolean
        type:
          $ref: '#/components/schemas/DayTypeEnum'
        config: {}
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotStructure'
      required:
      - id
      - routine
      - slots
    Day:
      type: object
      description: Day serializer
      properties:
        id:
          type: integer
          readOnly: true
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
