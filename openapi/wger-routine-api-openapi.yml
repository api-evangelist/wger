openapi: 3.2.0
info:
  title: wger Routine API
  version: 2.7.0a2
  description: "Self hosted FLOSS workout and fitness tracker.\n\n## Authentication\n\nSystem-wide data such as the exercise database, ingredients and units can be\nread without authenticating. Everything tied to a user account needs one of the\nfollowing, which are tried in this order:\n\n* `Authorization: Token <key>` with a personal API key. Users create one on the\n  API key page of their profile, e.g. `/en/user/api-key`.\n* `Authorization: Bearer <token>` with a JWT access token.\n* The session cookie, which is what a logged-in browser uses.\n\n## Pagination\n\nList endpoints take `limit` and `offset`, and answer with `count`, `next`,\n`previous` and `results`. The default page size is 20 and `limit` is capped\nat 999.\n\n`/api/v2/ingredient-sync/` is the exception. It uses cursor pagination so that\nsyncing the catalogue stays fast no matter how far a client has paginated. That\nresponse carries no `count`, and clients follow `next` instead of picking an\noffset.\n\n## Filtering and ordering\n\nMost list endpoints accept filters on a subset of their fields, plus `ordering`\nwith a field name that can be prefixed with `-` to reverse it. Both are listed\nper endpoint.\n\n## Unknown fields are dropped on write\n\nA field that the endpoint does not declare is ignored instead of rejected. Such\na request still answers 200 or 201, and the unknown field simply has no effect,\nso check a write against the response body rather than the status code.\n\n## Rate limits\n\nThe ingredient endpoints are rate limited because the catalogue holds millions\nof rows, and creating exercises is capped as well. Limits count per user for\nauthenticated callers and per IP otherwise. Exceeding one answers 429.\n"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: routine
  description: Workout routines. The nested day, slot and config structure is available in one request under `/routine/{id}/structure/`.
paths:
  /api/v2/routine/:
    get:
      operationId: routine_list
      description: API endpoint for routine objects
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoutineList'
          description: ''
    post:
      operationId: routine_create
      description: API endpoint for routine objects
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
  /api/v2/routine/{id}/:
    get:
      operationId: routine_retrieve
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
    put:
      operationId: routine_update
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
    patch:
      operationId: routine_partial_update
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoutineRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
          description: ''
    delete:
      operationId: routine_destroy
      description: API endpoint for routine objects
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v2/routine/{id}/date-sequence-display/:
    get:
      operationId: routine_date_sequence_display_list
      description: Return the day sequence of the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutDayDataDisplayMode'
          description: ''
  /api/v2/routine/{id}/date-sequence-gym/:
    get:
      operationId: routine_date_sequence_gym_list
      description: Return the day sequence of the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutDayDataGymMode'
          description: ''
  /api/v2/routine/{id}/logs/:
    get:
      operationId: routine_logs_list
      description: Returns the logs for the routine
      parameters:
      - in: query
        name: created
        schema:
          type: string
          format: date-time
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      - in: query
        name: is_public
        schema:
          type: boolean
      - in: query
        name: is_template
        schema:
          type: boolean
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: start
        schema:
          type: string
          format: date
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogDisplay'
          description: ''
  /api/v2/routine/{id}/stats/:
    get:
      operationId: routine_stats_retrieve
      description: Returns the logs for the routine
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogStatsData'
          description: ''
  /api/v2/routine/{id}/structure/:
    get:
      operationId: routine_structure_retrieve
      description: Return the full object structure of the routine.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this routine.
        required: true
      tags:
      - routine
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineStructure'
          description: ''
components:
  schemas:
    RiRConfig:
      type: object
      description: RiR Config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,1})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    SetNrConfig:
      type: object
      description: Set Nr config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: integer
          maximum: 50
          minimum: 0
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    LogStatsData:
      type: object
      description: Log Stats Data serializer
      properties:
        intensity:
          $ref: '#/components/schemas/GroupedLogData'
        sets:
          $ref: '#/components/schemas/GroupedLogData'
        volume:
          $ref: '#/components/schemas/GroupedLogData'
      required:
      - intensity
      - sets
      - volume
    DayStructure:
      type: object
      description: Day serializer
      properties:
        id:
          type: integer
          readOnly: true
        routine:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        name:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 1000
        is_rest:
          type: boolean
        need_logs_to_advance:
          type: boolean
        type:
          $ref: '#/components/schemas/DayTypeEnum'
        config: {}
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotStructure'
      required:
      - id
      - routine
      - slots
    ExerciseTypeEnum:
      enum:
      - normal
      - warmup
      - dropset
      - myo
      - partial
      - forced
      - tut
      - iso
      - jump
      type: string
      description: '* `normal` - Normal

        * `warmup` - Warmup

        * `dropset` - Dropset

        * `myo` - Myo

        * `partial` - Partial

        * `forced` - Forced

        * `tut` - Tut

        * `iso` - Iso Hold

        * `jump` - Jump'
    WorkoutDayDataGymMode:
      type: object
      description: WorkoutDayData serializer - gym mode
      properties:
        iteration:
          type: integer
        date:
          type: string
          format: date
        label:
          type: string
        day:
          $ref: '#/components/schemas/Day'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotData'
      required:
      - date
      - day
      - iteration
      - label
      - slots
    SlotEntryStructure:
      type: object
      description: Slot entry
      properties:
        id:
          type: integer
          readOnly: true
        slot:
          type: integer
        exercise:
          type: integer
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/ExerciseTypeEnum'
        class_name:
          type:
          - string
          - 'null'
          maxLength: 50
        config: {}
        repetition_unit:
          type:
          - integer
          - 'null'
        repetition_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        repetitions_configs:
          type: array
          items:
            $ref: '#/components/schemas/RepetitionsConfig'
        max_repetitions_configs:
          type: array
          items:
            $ref: '#/components/schemas/RepetitionsConfig'
        weight_unit:
          type:
          - integer
          - 'null'
          title: Unit
        weight_rounding:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        weight_configs:
          type: array
          items:
            $ref: '#/components/schemas/WeightConfig'
        max_weight_configs:
          type: array
          items:
            $ref: '#/components/schemas/WeightConfig'
        set_nr_configs:
          type: array
          items:
            $ref: '#/components/schemas/SetNrConfig'
        max_set_nr_configs:
          type: array
          items:
            $ref: '#/components/schemas/MaxSetNrConfig'
        rir_configs:
          type: array
          items:
            $ref: '#/components/schemas/RiRConfig'
        max_rir_configs:
          type: array
          items:
            $ref: '#/components/schemas/MaxRiRConfig'
        rest_configs:
          type: array
          items:
            $ref: '#/components/schemas/RestConfig'
        max_rest_configs:
          type: array
          items:
            $ref: '#/components/schemas/RestConfig'
      required:
      - exercise
      - id
      - max_repetitions_configs
      - max_rest_configs
      - max_rir_configs
      - max_set_nr_configs
      - max_weight_configs
      - repetitions_configs
      - rest_configs
      - rir_configs
      - set_nr_configs
      - slot
      - weight_configs
    MaxSetNrConfig:
      type: object
      description: Max Set Nr config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: integer
          maximum: 50
          minimum: 0
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    WorkoutSession:
      type: object
      description: Workout session serializer
      properties:
        id:
          type: string
          format: uuid
        routine:
          type:
          - integer
          - 'null'
        day:
          type:
          - integer
          - 'null'
        date:
          type: string
          format: date
        notes:
          type:
          - string
          - 'null'
          description: Any notes you might want to save about this workout session.
        impression:
          allOf:
          - $ref: '#/components/schemas/ImpressionEnum'
          title: General impression
          description: 'Your impression about this workout session. Did you exercise as well as you could?


            * `1` - Bad

            * `2` - Neutral

            * `3` - Good'
        time_start:
          type:
          - string
          - 'null'
          format: time
          title: Start time
        time_end:
          type:
          - string
          - 'null'
          format: time
          title: Finish time
    OperationEnum:
      enum:
      - +
      - '-'
      - r
      type: string
      description: '* `+` - Plus

        * `-` - Minus

        * `r` - Replace'
    SlotData:
      type: object
      description: Slot Data serializer
      properties:
        comment:
          type: string
        is_superset:
          type: boolean
        exercises:
          type: array
          items:
            type: integer
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetConfigData'
      required:
      - comment
      - exercises
      - is_superset
      - sets
    GroupedLogData:
      type: object
      description: Log Stats Data serializer
      properties:
        iteration:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        weekly:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        daily:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogData'
        mesocycle:
          $ref: '#/components/schemas/LogData'
      required:
      - daily
      - iteration
      - mesocycle
      - weekly
    PaginatedRoutineList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Routine'
    RepetitionsConfig:
      type: object
      description: Repetition Config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    ImpressionEnum:
      enum:
      - '1'
      - '2'
      - '3'
      type: string
      description: '* `1` - Bad

        * `2` - Neutral

        * `3` - Good'
    RestConfig:
      type: object
      description: Rest Config serializer
      properties:
        id:
          type: integer
          readOnly: true
        slot_entry:
          type: integer
        iteration:
          type: integer
          maximum: 2147483647
          minimum: 0
        value:
          type: integer
          maximum: 1800
          minimum: 0
        operation:
          $ref: '#/components/schemas/OperationEnum'
        step:
          $ref: '#/components/schemas/StepEnum'
        repeat:
          type: boolean
        requirements: {}
      required:
      - id
      - iteration
      - slot_entry
      - value
    SlotStructure:
      type: object
      description: Slot
      properties:
        id:
          type: integer
          readOnly: true
        day:
          type: integer
          title: Exercise day
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        comment:
          type: string
          maxLength: 200
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SlotEntryStructure'
        config: {}
      required:
      - day
      - entries
      - id
    RoutineStructure:
      type: object
      description: Routine structure serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        created:
          type: string
          format: date-time
          readOnly: true
          title: Creation date
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayStructure'
      required:
      - created
      - days
      - end
      - id
      - start
    WorkoutDayDataDisplayMode:
      type: object
      description: WorkoutDayData serializer - display mode
      properties:
        iteration:
          type: integer
        date:
          type: string
          format: date
        label:
          type: string
        day:
          $ref: '#/components/schemas/Day'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotData'
      required:
      - date
      - day
      - iteration
      - label
      - slots
    Routine:
      type: object
      description: Routine serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 1000
        created:
          type: string
          format: date-time
          readOnly: true
          title: Creation date
        start:
          type: string
          format: date
          title: Start date
        end:
          type: string
          format: date
          title: End date
        fit_in_week:
          type: boolean
        is_template:
          type: boolean
          title: Workout template
          description: Marking a workout as a template will freeze it and allow you to make copies of it
        is_public:
          type: boolean
          title: Public template
          description: A public template is available to other users
      required:
      - created
      - end
      - id
      - start
    MaxRiRConfig:
