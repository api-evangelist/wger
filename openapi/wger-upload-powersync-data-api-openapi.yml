openapi: 3.2.0
info:
  title: wger Upload Powersync Data API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: upload-powersync-data
paths:
  /api/v2/upload-powersync-data:
    put:
      operationId: upload_powersync_data_update
      tags:
      - upload-powersync-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowersyncUploadRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowersyncUploadResponse'
          description: ''
        '403':
          description: The request is not authenticated
        '500':
          description: Unclassified server error, the client should retry
        '503':
          description: Transient database error, the client should retry
      summary: Upload powersync data update
      x-summary-source: derived
    patch:
      operationId: upload_powersync_data_partial_update
      tags:
      - upload-powersync-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPowersyncUploadRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowersyncUploadResponse'
          description: ''
        '403':
          description: The request is not authenticated
        '500':
          description: Unclassified server error, the client should retry
        '503':
          description: Transient database error, the client should retry
      summary: Upload powersync data partial update
      x-summary-source: derived
    delete:
      operationId: upload_powersync_data_destroy
      tags:
      - upload-powersync-data
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowersyncUploadResponse'
          description: ''
        '403':
          description: The request is not authenticated
        '500':
          description: Unclassified server error, the client should retry
        '503':
          description: Transient database error, the client should retry
      summary: Upload powersync data destroy
      x-summary-source: derived
components:
  schemas:
    PatchedPowersyncUploadRequest:
      type: object
      properties:
        table:
          type: string
          minLength: 1
        data: {}
    PowersyncUploadResponse:
      type: object
      properties:
        status:
          type: string
        error:
          type: string
        details:
          type: string
    PowersyncUploadRequest:
      type: object
      properties:
        table:
          type: string
          minLength: 1
        data: {}
      required:
      - data
      - table
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
