openapi: 3.2.0
info:
  title: wger Check Language API
  version: 2.7.0a2
  description: Self hosted FLOSS workout and fitness tracker.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: /
  description: This server
- url: https://wger.de
  description: The "official" upstream wger instance
tags:
- name: check-language
paths:
  /api/v2/check-language/:
    post:
      operationId: check_language_create
      description: Checks the language of a string
      tags:
      - check-language
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageCheckRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - headlessJwtAuth: []
      - oidcAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageCheckResponse'
          description: ''
        '400':
          description: The input could not be detected as the given language, or the language itself is unknown
      summary: Check language create
      x-summary-source: derived
components:
  schemas:
    LanguageCheckRequest:
      type: object
      description: Serializer for language check
      properties:
        language:
          type: integer
        language_code:
          type: string
          minLength: 2
          maxLength: 2
        input:
          type: string
          minLength: 10
      required:
      - input
    LanguageCheckResponse:
      type: object
      properties:
        result:
          type: boolean
      required:
      - result
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    headlessJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the allauth headless endpoints
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oidcAuth:
      type: oauth2
      description: Access token issued by the OAuth2/OIDC provider
      flows:
        authorizationCode:
          authorizationUrl: https://wger.de/identity/o/authorize
          tokenUrl: https://wger.de/identity/o/api/token
          scopes:
            api:read: View your training, nutrition and body data
            api:write: Add and change your training, nutrition and body data
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  url: https://wger.readthedocs.io
  description: wger documentation
